services:
  - type: web
    name: landguard-ai-backend
    runtime: python
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    disk:
      name: landguard-storage
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.15
      - key: ENVIRONMENT
        value: production
      - key: PERSISTENT_DATA_PATH
        value: /data
      - key: ALLOW_VERCEL_PREVIEWS
        value: "true"
      - key: ALLOWED_ORIGINS
        value: "http://localhost:5173,https://land-guard-ai.vercel.app,https://landguard-ai.vercel.app"
    healthCheckPath: /health
